apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: planka-postgres
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: planka-postgres
  template:
    metadata:
      labels:
        app: planka-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.6-alpine
          env:
            - name: POSTGRES_DB
              value: planka
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planka-secrets
                  key: postgres-password
            # в корне ext4 лежит lost+found — initdb в непустой каталог не пойдёт
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: pg
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "planka"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: truenas-iscsi-retain
        resources:
          requests:
            storage: 5Gi