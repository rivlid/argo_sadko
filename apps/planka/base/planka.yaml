apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planka-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-iscsi-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planka
spec:
  replicas: 1
  # RWO-том: старый под должен отпустить его до старта нового
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: planka
  template:
    metadata:
      labels:
        app: planka
    spec:
      securityContext:
        fsGroup: 1000          # planka работает от node (uid 1000)
      initContainers:
        - name: wait-postgres
          image: postgres:16.6-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U postgres -d planka; do sleep 2; done"]
      containers:
        - name: planka
          image: ghcr.io/plankanban/planka:2.2.1
          envFrom:
            - configMapRef:
                name: planka-config   # BASE_URL — из overlay
          env:
            - name: TRUST_PROXY
              value: "true"
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planka-secrets
                  key: postgres-password
            # $(PG_PASSWORD) подставит k8s; пароль только hex — без спецсимволов для URL
            - name: DATABASE_URL
              value: postgresql://postgres:$(PG_PASSWORD)@postgres/planka
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: planka-secrets
                  key: secret-key
          ports:
            - name: http
              containerPort: 1337
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: planka-data
---
apiVersion: v1
kind: Service
metadata:
  name: planka
spec:
  selector:
    app: planka
  ports:
    - name: http
      port: 1337
      targetPort: http